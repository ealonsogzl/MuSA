# Conda environment for MuSA (GNU/Linux, macOS and Windows)
#
#   conda env create --file MuSAenv.yml
#   conda activate MuSA
#
# Optional extra (not needed to run MuSA):
#   helpers/plot_example.py -> conda install -c conda-forge matplotlib-base
name: MuSA
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - numba
  - netcdf4
  - python-blosc
  - threadpoolctl
  # Sparse Cholesky for Spatial_propagation with sparse covariance matrices
  - scikit-sparse
  # OpenBLAS on every platform: threadpoolctl may fail with MKL on Windows
  - libblas=*=*openblas
  # Fortran compiler used to build FSM2
  - gfortran
  # MPI parallelization (MPI = True)
  - mpi4py
  # Dependencies of SMRT (run_smrt = True), which is installed with pip below
  - xarray
  - joblib
  - pip
  - pip:
      - pandas-downcast
      - smrt
